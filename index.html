<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Story Clock</title>

<style>
body {
    margin:0;
    font-family: system-ui, Arial;
    background: linear-gradient(180deg,#020617,#0f172a);
    color:#e2e8f0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    text-align:center;
}
.container { max-width:500px; padding:20px; width:100%; }

input, button {
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:none;
    font-size:1rem;
}
button { background:#38bdf8; color:#000; font-weight:bold; }

.clock { display:flex; gap:10px; margin-top:20px; }
.box {
    flex:1;
    background:#1e293b;
    padding:12px;
    border-radius:10px;
}
.number { font-size:1.4rem; color:#38bdf8; font-weight:bold; }
.label { font-size:0.75rem; color:#94a3b8; }

.story {
    margin-top:20px;
    font-size:0.9rem;
    color:#cbd5f5;
    line-height:1.5;
}
</style>
</head>

<body>

<div class="container">
    <h2>Your Survival Story</h2>

    <input type="date" id="date">
    <input type="time" id="time">
    <button onclick="startClock()">Start My Story</button>

    <div class="clock" id="clock" style="display:none;">
        <div class="box"><div class="number" id="days">0</div><div class="label">Days</div></div>
        <div class="box"><div class="number" id="hours">0</div><div class="label">Hours</div></div>
        <div class="box"><div class="number" id="seconds">0</div><div class="label">Seconds</div></div>
    </div>

    <div class="story" id="story"></div>
</div>

<script>
let birthDate;

function startClock(){
    const d = document.getElementById("date").value;
    const t = document.getElementById("time").value || "00:00";
    if(!d) return alert("Enter date");

    birthDate = new Date(d + "T" + t);
    document.getElementById("clock").style.display="flex";

    update();
    setInterval(update,1000);
}

function update(){
    const now = new Date();
    let diff = now - birthDate;

    const seconds = Math.floor(diff/1000)%60;
    const hours = Math.floor(diff/(1000*60*60))%24;
    const days = Math.floor(diff/(1000*60*60*24));

    const sunrises = days; // simple assumption

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("seconds").textContent = seconds;

    document.getElementById("story").innerHTML =
        `You have survived <b>${days}</b> days,<br>
         witnessed <b>${sunrises}</b> sunrises,<br>
         and lived through <b>${Math.floor(diff/1000).toLocaleString()}</b> seconds.<br><br>
         Every second—earned.`;
}
</script>

</body>
</html>
